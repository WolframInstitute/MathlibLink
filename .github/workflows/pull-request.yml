name: Repository checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  repository:
    name: Sources and workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whitespace and JSON resources
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("MathlibLink/Resources").glob("*.json"))
          assert files, "No runtime manifests found"
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          PY

      - name: Validate workflows with pinned actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

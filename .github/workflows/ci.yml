name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mathliblink-ci
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  trusted-ref:
    name: Require main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the trusted branch
        env:
          REF: ${{ github.ref }}
        run: |
          test "$REF" = refs/heads/main || { echo '::error::Run native CI from main.'; exit 1; }

  repository:
    uses: ./.github/workflows/pull-request.yml

  runtime:
    name: Lean and mathlib (${{ matrix.system }})
    needs: [trusted-ref, repository]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: Linux-x86-64, runner: ubuntu-24.04}
          - {system: Windows-x86-64, runner: windows-2025}
          - {system: MacOSX-ARM64, runner: macos-15}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-lean
        id: runtime
        with:
          system: ${{ matrix.system }}

      - name: Check native computations and proofs
        working-directory: ${{ steps.runtime.outputs.directory }}
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/ci"
          lake env lean "$GITHUB_WORKSPACE/MathlibLink/Tests/Runtime.lean" 2>&1 | tee "$GITHUB_WORKSPACE/build/ci/runtime.log"
          git diff --exit-code HEAD

      - name: Preserve native runtime results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MathlibLink-runtime-${{ matrix.system }}
          path: build/ci/runtime.log
          if-no-files-found: warn
          retention-days: 30

  paclet:
    name: Wolfram tests, documentation and paclet
    needs: [trusted-ref, repository]
    runs-on: ubuntu-24.04
    container:
      image: wolframresearch/wolframengine:15.0@sha256:3ac08d6aaa33e6dccdda38d14cf8a7e5c22cc84d037a1a7562900914a487ef65
      options: --user root --init
    env:
      QT_QPA_PLATFORM: offscreen
    timeout-minutes: 180
    steps:
      - name: Install Linux container tools
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git make python3 ca-certificates curl tar xz-utils unzip zstd
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-mathlib
        with:
          documentation: 'true'
          entitlement: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}

      - name: Check sources and run all Wolfram tests
        run: |
          set -o pipefail
          mkdir -p build/ci
          make check 2>&1 | tee build/ci/check.log
          make test 2>&1 | tee build/ci/local.log
          make test-mathlib 2>&1 | tee build/ci/mathlib.log

      - name: Preserve Wolfram test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MathlibLink-tests-Linux-x86-64
          path: |
            build/ci/*.log
            build/Tests-*.wl
          if-no-files-found: warn
          retention-days: 30

      - name: Build and check documentation and archive
        run: |
          set -o pipefail
          mkdir -p build/ci
          make check-publish 2>&1 | tee build/ci/documentation.log

      - name: Install the archive and check the public Wolfram interface
        run: |
          # shellcheck disable=SC2016
          wolframscript -code '
            archive = First[FileNames["*.paclet", FileNameJoin[{Directory[], "dist"}]]];
            installed = PacletInstall[archive, ForceVersionInstall -> True];
            If[! MatchQ[installed, _PacletObject], Print[InputForm[installed]]; Exit[1]];
            Needs["WolframInstitute`MathlibLink`"];
            If[! StringStartsQ[FindFile["WolframInstitute`MathlibLink`"], installed["Location"]], Print["The package did not load from the installed archive."]; Exit[1]];
            session = StartMathlibSession["Imports" -> {"Mathlib.Data.Nat.Choose.Basic"}];
            If[FailureQ[session], Print[InputForm[session]]; Exit[1]];
            value = MathlibCall[session, "Nat.choose", 10, 3];
            proof = ProveMathlib[session, "forall n : Nat, n + 0 = n", "by intro n; rfl"];
            rejected = ProveMathlib[session, "False", "by sorry"];
            ok = value === 120 && TrueQ[proof["Verified"]] && rejected["Tag"] === "MathlibUntrustedProof" && session["Status"] === "Ready";
            DeleteObject[session];
            If[! TrueQ[ok], Print[InputForm[{value, proof, rejected}]]; Exit[1]];'

      - name: Preserve the verified archive and PacletPage build
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          mkdir -p build/release
          cp dist/*.paclet build/release/
          tar --exclude=build/cache --exclude=build/incremental \
            -czf build/release/pacletpage-build.tar.gz -C MathlibLink \
            Documentation ResourceDefinition.nb build
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path("build/release")
          version = re.search(r'^\s*"Version" -> "([^"]+)"', Path("MathlibLink/PacletInfo.wl").read_text(), re.M)[1]
          archive = root / f"WolframInstitute__MathlibLink-{version}.paclet"
          assert list(root.glob("*.paclet")) == [archive], "Expected exactly the current version's archive"
          files = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in [archive, root / "pacletpage-build.tar.gz"]}
          manifest = {"commit": os.environ["GITHUB_SHA"], "version": version, "run_id": os.environ["GITHUB_RUN_ID"], "files": files}
          provenance = root / "build.json"
          provenance.write_text(json.dumps(manifest, indent=2) + "\n")
          files[provenance.name] = hashlib.sha256(provenance.read_bytes()).hexdigest()
          (root / "SHA256SUMS").write_text("".join(f"{digest}  {name}\n" for name, digest in sorted(files.items())))
          PY

      - name: Verify publication can reuse the build in a clean checkout
        env:
          MATHLIBLINK_RESTORE: ${{ runner.temp }}/mathlib-release-check
        run: |
          git worktree add --detach "$MATHLIBLINK_RESTORE" HEAD
          trap 'git worktree remove --force "$MATHLIBLINK_RESTORE"' EXIT
          tar -xzf build/release/pacletpage-build.tar.gz -C "$MATHLIBLINK_RESTORE/MathlibLink"
          mkdir -p "$MATHLIBLINK_RESTORE/dist"
          cp build/release/*.paclet "$MATHLIBLINK_RESTORE/dist/"
          # Wolfram symbols and contexts must reach the kernel literally.
          # shellcheck disable=SC2016
          wolframscript -code '
            Needs["WolframInstitute`PacletPage`"];
            root = Environment["MATHLIBLINK_RESTORE"];
            expected = FileHash[First[FileNames["*.paclet", FileNameJoin[{root, "dist"}]]], "SHA256"];
            result = PublishPacletPage[FileNameJoin[{root, "MathlibLink"}], "MathlibLink", "Build" -> False, "DryRun" -> True, "ResourceOptions" -> {"Build" -> False, "Parallel" -> False}];
            If[! AssociationQ[result] || ! StringQ[result["Resource"]["Archive"]] || FileHash[result["Resource"]["Archive"], "SHA256"] =!= expected, Print[InputForm[result]]; Exit[1]];'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MathlibLink-verified
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Preserve documentation log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MathlibLink-documentation-log
          path: build/ci/documentation.log
          if-no-files-found: warn
          retention-days: 30

name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release vX.Y.Z to publish with PacletPage.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: mathliblink-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Require a verified GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify main, the release tag and successful CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          test "$REF" = refs/heads/main || { echo '::error::Dispatch publishing from main.'; exit 1; }
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '::error::Use an existing vX.Y.Z release.'; exit 1; }
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main || { echo '::error::The release commit must be on main.'; exit 1; }
          version=$(git show "$commit:MathlibLink/PacletInfo.wl" | sed -n 's/^[[:space:]]*"Version" -> "\([^"]*\)",/\1/p')
          test "$TAG" = "v$version" || { echo '::error::The tag must match PacletInfo.wl.'; exit 1; }
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false || { echo '::error::Complete the GitHub release first.'; exit 1; }
          mkdir -p build/release
          gh release download "$TAG" --pattern '*.paclet' --pattern pacletpage-build.tar.gz \
            --pattern build.json --pattern SHA256SUMS --dir build/release
          cd build/release
          sha256sum --check SHA256SUMS
          export COMMIT="$commit" VERSION="$version"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path("build.json").read_text())
          assert manifest["commit"] == os.environ["COMMIT"] and manifest["version"] == os.environ["VERSION"], "Release provenance mismatch"
          assert str(manifest["run_id"]).isdigit(), "Invalid CI run identifier"
          expected = {f"WolframInstitute__MathlibLink-{os.environ['VERSION']}.paclet", "pacletpage-build.tar.gz"}
          assert set(manifest["files"]) == expected, "Unexpected release files"
          for name, digest in manifest["files"].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          Path("run-id").write_text(str(manifest["run_id"]))
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$(cat run-id)" > run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path("run.json").read_text())
          assert run["conclusion"] == "success" and run["head_sha"] == os.environ["COMMIT"] and run["head_branch"] == "main", "CI did not pass for this commit on main"
          assert run["event"] in {"push", "workflow_dispatch"} and run["path"] == ".github/workflows/ci.yml", "Unexpected verification workflow"
          PY
          rm run-id run.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Transfer the checked release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MathlibLink-publish
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish the same archive with PacletPage
    needs: verify
    runs-on: ubuntu-24.04
    container:
      image: wolframresearch/wolframengine:15.0@sha256:3ac08d6aaa33e6dccdda38d14cf8a7e5c22cc84d037a1a7562900914a487ef65
      options: --user root
    env:
      QT_QPA_PLATFORM: offscreen
    timeout-minutes: 90
    steps:
      - name: Install Linux container tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git make python3 ca-certificates curl tar xz-utils unzip zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-mathlib
        with:
          system: Linux-x86-64
          documentation: 'true'
          entitlement: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MathlibLink-publish
          path: dist

      - name: Restore the verified PacletPage build
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, tarfile
          from pathlib import Path
          manifest = json.loads(Path("dist/build.json").read_text())
          assert manifest["commit"] == subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "Checkout differs from release"
          for name, digest in manifest["files"].items():
              assert hashlib.sha256((Path("dist") / name).read_bytes()).hexdigest() == digest, name
          with tarfile.open("dist/pacletpage-build.tar.gz") as archive:
              archive.extractall("MathlibLink", filter="data")
          PY

      - name: Publish and check the cloud resource and documentation
        env:
          WOLFRAM_CLOUD_USER: ${{ secrets.WOLFRAM_CLOUD_USER }}
          WOLFRAM_CLOUD_PASSWORD: ${{ secrets.WOLFRAM_CLOUD_PASSWORD }}
        run: |
          if [ -z "$WOLFRAM_CLOUD_USER" ] || [ -z "$WOLFRAM_CLOUD_PASSWORD" ]; then
            echo '::error::Configure WOLFRAM_CLOUD_USER and WOLFRAM_CLOUD_PASSWORD as repository secrets.'
            exit 1
          fi
          # Wolfram reads these credentials from its environment, not shell expansion.
          # shellcheck disable=SC2016
          wolframscript -code '
            connected = Quiet[Check[CloudConnect[Environment["WOLFRAM_CLOUD_USER"], Environment["WOLFRAM_CLOUD_PASSWORD"]], $Failed]];
            If[connected === $Failed || ! TrueQ[$CloudConnected], Print["Cloud authentication failed."]; Exit[1]];
            WithCleanup[Block[{$ScriptCommandLine = {"scripts/docs.wls", "publish"}}, Get[FileNameJoin[{Directory[], "scripts", "docs.wls"}]]], CloudDisconnect[]];'

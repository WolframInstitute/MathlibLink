name: Prepare the pinned Lean runtime
description: Install the pinned elan, Lean and mathlib releases for native runtime checks.
inputs:
  system:
    description: Expected native system identifier.
    required: true
outputs:
  directory:
    description: Verified mathlib checkout.
    value: ${{ steps.prepare.outputs.directory }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/mathlib-elan
        key: mathlib-lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MathlibLink/Resources/Runtime.json', '.github/actions/setup-lean/action.yml') }}

    - name: Prepare and verify the runtime
      id: prepare
      shell: bash
      env:
        MATHLIBLINK_SYSTEM: ${{ inputs.system }}
      run: |
        python - <<'PY'
        import hashlib, json, os, platform, subprocess, tarfile, tempfile, zipfile
        from pathlib import Path

        config = json.loads(Path("MathlibLink/Resources/Runtime.json").read_text())
        expected = {
            "Linux-x86-64": ("Linux", "x86_64"),
            "Windows-x86-64": ("Windows", "amd64"),
            "MacOSX-ARM64": ("Darwin", "arm64"),
        }
        system = os.environ["MATHLIBLINK_SYSTEM"]
        if (platform.system(), platform.machine().lower()) != expected[system]:
            raise SystemExit("The runtime runner does not match its declared platform.")
        root = Path(os.environ["RUNNER_TEMP"])
        elan_home, project = root / "mathlib-elan", root / "mathlib"
        suffix = ".exe" if platform.system() == "Windows" else ""
        binaries = elan_home / "bin"
        elan, lake = binaries / ("elan" + suffix), binaries / ("lake" + suffix)
        environment = os.environ | {"ELAN_HOME": str(elan_home), "PATH": str(binaries) + os.pathsep + os.environ["PATH"]}

        def run(arguments, **options):
            return subprocess.run([str(value) for value in arguments], env=environment, check=True, **options)

        if not elan.is_file():
            asset = config["ElanArchives"][system]
            with tempfile.TemporaryDirectory(prefix="elan-install-", dir=root) as temporary:
                directory = Path(temporary)
                archive = directory / Path(asset["URL"]).name
                run(["curl", "--fail", "--location", "--retry", "3", "--retry-all-errors",
                     "--connect-timeout", "30", "--max-time", "180", "--output", archive, asset["URL"]])
                if hashlib.sha256(archive.read_bytes()).hexdigest() != asset["SHA256"]:
                    raise SystemExit("The elan archive does not match its pinned checksum.")
                if suffix:
                    with zipfile.ZipFile(archive) as package:
                        package.extractall(directory)
                else:
                    with tarfile.open(archive) as package:
                        package.extractall(directory, filter="data")
                installer = directory / ("elan-init" + suffix)
                installer.chmod(0o755)
                run([installer, "-y", "--no-modify-path", "--default-toolchain", "none"])
        version = run([elan, "--version"], capture_output=True, text=True).stdout.strip()
        if not version.startswith("elan " + config["ElanVersion"] + " "):
            raise SystemExit("Unexpected cached elan version.")
        print(version, flush=True)
        run([elan, "toolchain", "install", config["LeanToolchain"]])
        run(["git", "clone", "-c", "core.autocrlf=false", "--depth", "1", "--branch",
             config["LeanToolchain"].split(":")[-1], config["MathlibRepository"], project])
        revision = run(["git", "rev-parse", "HEAD"], cwd=project, capture_output=True, text=True).stdout.strip()
        if revision != config["MathlibRevision"] or (project / "lean-toolchain").read_text().strip() != config["LeanToolchain"]:
            raise SystemExit("The mathlib checkout does not match the pinned runtime.")
        manifest = (project / "lake-manifest.json").read_bytes()
        run([lake, "+" + config["LeanToolchain"], "exe", "cache", "get"], cwd=project)
        run([lake, "+" + config["LeanToolchain"], "build", "Mathlib"], cwd=project)
        run(["git", "diff", "--exit-code", "HEAD"], cwd=project)
        if (project / "lake-manifest.json").read_bytes() != manifest:
            raise SystemExit("Runtime setup changed the pinned dependency manifest.")
        run([binaries / ("lean" + suffix), "+" + config["LeanToolchain"], "--version"], cwd=project)
        for variable, content in {
            "GITHUB_PATH": str(binaries),
            "GITHUB_ENV": "ELAN_HOME=" + str(elan_home),
            "GITHUB_OUTPUT": "directory=" + str(project),
        }.items():
            with Path(os.environ[variable]).open("a", encoding="utf-8") as stream:
                stream.write(content + "\n")
        PY

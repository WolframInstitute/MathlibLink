name: Prepare MathlibLink
description: Verify the container license and prepare the pinned mathlib and documentation tools.
inputs:
  documentation:
    description: Require the pinned PacletPage builder and a working front end.
    default: 'false'
  entitlement:
    description: On-demand license entitlement for the fresh hosted runner.
    required: true
runs:
  using: composite
  steps:
    - name: Require the hosted-runner entitlement
      shell: bash
      env:
        MATHLIBLINK_ENTITLEMENT: ${{ inputs.entitlement }}
      run: |
        test -n "$MATHLIBLINK_ENTITLEMENT" || { echo '::error::Set the WOLFRAMSCRIPT_ENTITLEMENTID repository secret; see docs/workflows.md.'; exit 1; }
        [[ "$MATHLIBLINK_ENTITLEMENT" != *$'\n'* && "$MATHLIBLINK_ENTITLEMENT" != *$'\r'* ]] || { echo '::error::The entitlement ID must be one line.'; exit 1; }

    - name: Check container tools and Wolfram license
      shell: bash
      env:
        MATHLIBLINK_ENTITLEMENT: ${{ inputs.entitlement }}
      run: |
        for tool in git make python3 wolframscript; do
          command -v "$tool" >/dev/null || { echo "::error::Required runner tool is missing: $tool"; exit 1; }
        done
        python3 -c 'import sys; assert sys.version_info >= (3, 12), "Python 3.12 or later is required"'
        export WOLFRAMSCRIPT_ENTITLEMENTID="$MATHLIBLINK_ENTITLEMENT"
        printf 'WOLFRAMSCRIPT_ENTITLEMENTID=%s\n' "$WOLFRAMSCRIPT_ENTITLEMENTID" >> "$GITHUB_ENV"
        echo 'Using the configured on-demand entitlement.'
        # Wolfram symbols must reach the kernel literally.
        # shellcheck disable=SC2016
        wolframscript -code '
          If[! TrueQ[15 <= $VersionNumber < 16] || $SystemID =!= "Linux-x86-64", Print[{$Version, $SystemID}]; Exit[1]];
          Print[$Version, " | ", $SystemID];'

    - name: Install the pinned mathlib runtime
      shell: bash
      run: |
        # shellcheck disable=SC2016
        wolframscript -code '
          PacletDirectoryLoad[FileNameJoin[{Directory[], "MathlibLink"}]];
          Needs["WolframInstitute`MathlibLink`"];
          lastStage = None;
          result = InstallMathlib["ProgressFunction" -> Function[{stage, fraction},
            If[stage =!= lastStage, Print["Mathlib setup: ", stage]; lastStage = stage]]];
          If[! MatchQ[result, File[_String]], Print[InputForm[result]]; Exit[1]];
          status = MathlibInstallation[];
          If[! AssociationQ[status] || status["Status"] =!= "Ready", Print[InputForm[status]]; Exit[1]];
          Print[KeyTake[status, {"Status", "Toolchain", "Revision"}]];'

    - name: Install pinned documentation tools
      if: inputs.documentation == 'true'
      shell: bash
      run: |
        root="$RUNNER_TEMP/mathlib-doc-tools"
        mkdir -p "$root/sources" "$root/archives"
        fetch() {
          local name="$1" url="$2" revision="$3" checkout="$root/$1"
          git init --quiet "$checkout"
          git -C "$checkout" remote add origin "$url"
          git -C "$checkout" fetch --quiet --depth 1 origin "$revision"
          git -C "$checkout" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$checkout" rev-parse HEAD)" = "$revision"
          mkdir -p "$root/sources/$name"
          git -C "$checkout" archive HEAD | tar -x -C "$root/sources/$name"
        }
        fetch PacletPage https://github.com/WolframInstitute/PacletPage.git ad583493187194eeaa22d7e774a30ca475934aa4
        fetch MarkdownToNotebook https://github.com/WolframInstitute/MarkdownToNotebook.git c2b5703cc813ef620dd744fca82353bfbfb6ca6f
        fetch WolframParser https://github.com/sw1sh/WolframParser.git 0697ceb787111be04f0d9f043d7674ee146c76c2
        export MATHLIBLINK_DOC_TOOLS="$root/sources"
        echo "MATHLIBLINK_DOC_TOOLS=$MATHLIBLINK_DOC_TOOLS" >> "$GITHUB_ENV"
        # shellcheck disable=SC2016
        wolframscript -code '
          root = Environment["MATHLIBLINK_DOC_TOOLS"];
          output = FileNameJoin[{DirectoryName[root], "archives"}];
          Do[
            archive = CreatePacletArchive[directory, output];
            If[! StringQ[archive] || ! FileExistsQ[archive], Print["Could not pack a documentation dependency."]; Exit[1]];
            installed = PacletInstall[archive, ForceVersionInstall -> True];
            If[! MatchQ[installed, _PacletObject], Print[InputForm[installed]]; Exit[1]],
            {directory, {FileNameJoin[{root, "WolframParser", "Parser"}], FileNameJoin[{root, "PacletPage"}]}}
          ];
          If[PacletObject["WolframInstitute/PacletPage"]["Version"] =!= "0.3.42", Print["Unexpected PacletPage version."]; Exit[1]];
          Needs["WolframInstitute`PacletPage`"];
          Needs["Wolfram`Parser`"];
          If[! TrueQ[UsingFrontEnd[MatchQ[$FrontEnd, _FrontEndObject]]], Print["The documentation runner needs a working front end."]; Exit[1]];'
